<!doctype html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zeitraum berechnen – Jobtools</title>
  <link href="style.css" rel="stylesheet" />
  <script src="settings.js" defer></script>
  <script src="durations.js" defer></script>
</head>

<body>
  <a class="skip-link" href="#inhalt">Zum Inhalt springen</a>

  <header>
    <p class="brand">Jobtools</p>
    <nav class="navbar" aria-label="Hauptnavigation">
      <ul>
        <li><a href="index.html">Arbeitszeit</a></li>
        <li><a href="convert.html">Wochenarbeitszeit</a></li>
        <li><a href="ages.html">Alter berechnen</a></li>
        <li><a class="active" href="durations.html" aria-current="page">Zeitraum berechnen</a></li>
      </ul>
    </nav>
  </header>

  <main id="inhalt">
    <h1>Zeitraum berechnen</h1>
    <div id="maxi-container">
      <div class="field-group" id="div-start">
        <!-- Startdatum (erster Tag des Zeitraums) -> input date -->
        <div class="input-line">
          <label for="start">Startdatum:</label>
          <input type="date" name="start" id="start">
        </div>
      </div>

      <div class="field-group" id="div-summand">
        <!-- wieviel addieren? -> input number -->
        <div class="input-line">
          <label for="summand">Wieviel addieren?</label>
          <input type="number" name="summand" id="summand">
        </div>
        <!-- welche Einheit (Tage, Wochen, Monate) -> radio -->
        <fieldset class="option-group">
          <legend>Einheit</legend>
          <input type="radio" name="units" id="radio-days" value="days">
          <label for="radio-days">Tage</label>
          <input type="radio" name="units" id="radio-weeks" value="weeks">
          <label for="radio-weeks">Wochen</label>
          <input type="radio" name="units" id="radio-months" value="months">
          <label for="radio-months">Monate</label>
        </fieldset>
      </div>

      <div id="button-container">
        <!-- Button -->
      </div>

      <dl id="result-container" aria-live="polite">
        <!-- Ausgabe: letzter Tag des Zeitraums -> ouput date -->
      </dl>
    </div>
  </main>

  <footer>
    <p>&copy; <a href="mailto:cschult@devmem.de">Christian Schult &lt;cschult@devmem.de&gt;</a>
    </p>
  </footer>
</body>

</html>
