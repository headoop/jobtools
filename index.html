<!doctype html>
<html lang="de">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>jobtools</title>
    <link href="style.css" rel="stylesheet" />
    <script src="index.js" async></script>
  </head>

  <body>
    <header>
      <p class="brand">Jobtools</p>
      <nav class="navbar">
        <ul>
          <li><a class="active" href="#">Arbeitszeit</a></li>
          <li><a href="convert.html">Wochenarbeitszeit</a></li>
          <li><a href="ages.html">Alter berechnen</a></li>
          <li><a href="durations.html">Zeitraum berechnen</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <h1>Arbeitszeit berechnen</h1>
      <div id="maxi-container">
        <div id="input-container">
          <div class="input-line">
            <label for="beginWork">Beginn:</label>
            <input type="time" name="beginWork" id="beginWork" value="" />
          </div>
          <div class="input-line">
            <label for="endWork">Ende:</label>
            <input type="time" name="endWork" id="endWork" value="" />
          </div>
        </div>
        <div id="button-container">
          <button type="submit" onclick="logInput()">Berechnen</button>
        </div>
        <div id="result-container">
          <p id="endDay"></p>
          <p id="workTime"></p>
          <p id="diffTime"></p>
          <p id="pause"></p>
        </div>
      </div>

    </main>

    <footer>
      <p>&#9400; <a href="mailto:cschult@devmem.de">Christian Schult &lt;cschult@devmem.de&gt;</a>
      </p>
    </footer>

  </body>
</html>
