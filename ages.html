  <main>
    <h1>Alter berechnen</h1>
    <div id="maxi-container">
      <p class="hint">
        Berechnet das Alter am heutigen Tag sowie den Tag vor dem 18. und dem
        21. Geburtstag.
      </p>

      <div id="input-container">
        <div class="input-line">
          <label for="birthday">Geburtsdatum:</label>
          <input type="date" name="birthday" id="birthday" value="" />
        </div>
      </div>
      <div id="button-container">
        <button type="submit" onclick="action()">Berechnen</button>
      </div>
      <div id="result-container">
        <p>heutiges Alter: <span id="age-today"></span></p>
        <p>Tag vor dem 18.: <span id="day-before-18"></span></p>
        <p>Tag vor dem 21.: <span id="day-before-21"></span></p>
      </div>
    </div>
  </main>
